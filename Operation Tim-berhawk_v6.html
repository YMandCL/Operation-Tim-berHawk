<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operation Tim-berhawk</title>
<link href="https://fonts.googleapis.com/css2?family=Metal+Mania&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0707;--ink:#efe6d2;--blood:#c8201e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Metal Mania',Impact,'Arial Narrow',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#pad{display:none;position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-between;padding:0 10px;pointer-events:none}
#pad div{display:flex;gap:8px;pointer-events:auto}
#pad button{font:inherit;font-size:18px;min-width:56px;min-height:52px;background:rgba(42,12,12,.8);color:var(--ink);border:2px solid var(--blood);border-radius:8px;touch-action:none}
#pad button:active{background:var(--blood)}
@media (pointer:coarse){#pad{display:flex}}
</style></head><body>
<canvas id="c" aria-label="Operation Tim-berhawk game"></canvas>
<div id="pad"><div><button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button></div><div><button data-k="KeyH">Horn</button><button data-k="KeyX">Missile</button><button data-k="Space">Fire</button><button data-k="ArrowDown">▼</button><button data-k="ArrowUp">▲</button></div></div>
<script>
/* ===== main.js: setup + loop ===== */
const cv=document.getElementById('c'),g=cv.getContext('2d'),MAP=4000,keys={};
let vw=0,vh=0,state='title',frame=0,msg='',msgT=0,shake=0,nbub=0;
function fit(){const d=Math.min(2,devicePixelRatio||1);vw=innerWidth;vh=innerHeight;cv.width=vw*d;cv.height=vh*d;g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',fit);fit();
function say(s){msg=s;msgT=200}
function tx(s,x,y,size,c,al='center'){g.font=size+"px 'Metal Mania',Impact,sans-serif";g.textAlign=al;g.fillStyle=c;g.fillText(s,x,y)}

/* ===== map.js: world, river, trees ===== */
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(7),RW=95,riverY=x=>1700+Math.sin(x/520)*230+Math.sin(x/170)*35;
const BASE={x:1200,y:3300},BRIDGES=[1900,3200];
const POI=[{n:'Base camp',k:'base',x:1200,y:3300,c:'#5fd16a'},{n:'Concert',k:'concert',x:3000,y:850,c:'#e04fd0'},{n:'Village',k:'village',x:700,y:2500,c:'#d9b98a'},{n:'Village',k:'village',x:3300,y:2700,c:'#d9b98a'},{n:'Prims',k:'compound',x:500,y:700,c:'#e0302e'},{n:'Fuel depot',k:'depot',x:2200,y:2300,c:'#ffd36b'},{n:'Enemy outpost',k:'compound',x:3500,y:2100,c:'#e0302e'}];
const JUNGLE=[[800,1200,380],[2000,600,420],[3400,3500,420],[2300,3300,300],[400,3600,300],[3600,1500,300]];
const trees=[];
for(let n=0;n<1500&&trees.length<900;n++){let x,y;if(n%6===0){x=R()*MAP;y=R()*MAP}else{const j=JUNGLE[R()*JUNGLE.length|0],a=R()*6.283,d=Math.sqrt(R())*j[2];x=j[0]+Math.cos(a)*d;y=j[1]+Math.sin(a)*d}
 if(x<30||y<30||x>MAP-30||y>MAP-30||Math.abs(y-riverY(x))<RW+30||Math.abs(y-3850)<70||POI.some(p=>Math.hypot(p.x-x,p.y-y)<290))continue;trees.push({x,y,s:.8+R()*.7})}
const crowd=Array.from({length:150},()=>({x:(R()-.5)*380,y:-60+R()*230,c:['#e8c24a','#d9453f','#efe6d2','#5aa0d8','#b06ad8'][R()*5|0],p:R()*6}));
function hs(i,j){let h=Math.imul(i,374761393)^Math.imul(j,668265263);h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296}

/* ===== camera.js ===== */
const cam={x:BASE.x-400,y:BASE.y-200};
function camUpdate(){const tx_=T.x+T.vx*22-vw/2,ty=T.y+T.vy*22-vh/2;cam.x+=(tx_-cam.x)*.08;cam.y+=(ty-cam.y)*.08;cam.x=Math.max(0,Math.min(MAP-vw,cam.x));cam.y=Math.max(0,Math.min(MAP-vh,cam.y))}

/* ===== audio.js: Johnny's gobble horn ===== */
let ac;function initAudio(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();musicInit()}catch(e){ac=null}}
function gobble(n=0){if(!ac)return;if(ac.state!=='running'&&n<2){ac.resume().then(()=>gobble(n+1)).catch(()=>{});return}try{const t0=ac.currentTime,o=ac.createOscillator(),f=ac.createBiquadFilter(),e=ac.createGain(),v=ac.createGain(),w=ac.createOscillator(),wg=ac.createGain(),am=ac.createOscillator(),ag=ac.createGain();
 o.type='sawtooth';f.type='bandpass';f.frequency.value=1000;f.Q.value=3;v.gain.value=.55;w.frequency.value=32;wg.gain.value=70;am.frequency.value=28;ag.gain.value=.35;
 o.connect(f);f.connect(e);e.connect(v);v.connect(ac.destination);w.connect(wg);wg.connect(o.frequency);am.connect(ag);ag.connect(v.gain);e.gain.setValueAtTime(0,t0);
 for(let i=0;i<3;i++){const t=t0+i*.26,p=620-i*50;o.frequency.setValueAtTime(p,t);o.frequency.exponentialRampToValueAtTime(p*.55,t+.22);e.gain.setValueAtTime(.001,t);e.gain.linearRampToValueAtTime(1.2,t+.03);e.gain.linearRampToValueAtTime(.2,t+.22);f.frequency.setValueAtTime(1300,t);f.frequency.linearRampToValueAtTime(700,t+.22)}
 e.gain.linearRampToValueAtTime(0,t0+.85);[o,w,am].forEach(x=>{x.start(t0);x.stop(t0+.9)})}catch(e){}}

/* music: original clean-intro-into-heavy-gallop theme (synth) */
let mute=false,mStep=0,dist,mg,noiseBuf;
function musicInit(){if(dist||!ac)return;const ws=ac.createWaveShaper(),c=new Float32Array(256);for(let i=0;i<256;i++)c[i]=Math.tanh((i/128-1)*7);ws.curve=c;const o=ac.createGain();o.gain.value=.14;ws.connect(o);o.connect(ac.destination);dist=ws;mg=ac.createGain();mg.gain.value=.5;mg.connect(ac.destination);
 noiseBuf=ac.createBuffer(1,ac.sampleRate*.2,ac.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;setInterval(musicTick,140)}
function note(f,d,type,out,v){const o=ac.createOscillator(),n=ac.createGain();o.type=type;o.frequency.value=f;n.gain.setValueAtTime(v,ac.currentTime);n.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(n);n.connect(out);o.start();o.stop(ac.currentTime+d)}
/* sfx: rotor thump, gun, explosion, armor hit */
const sok=()=>ac&&mg&&noiseBuf&&!mute&&ac.state==='running';
function nz(d,fq,v){if(!sok())return;try{const b=ac.createBufferSource(),f=ac.createBiquadFilter(),e=ac.createGain();b.buffer=noiseBuf;b.loop=true;f.type='lowpass';f.frequency.value=fq;e.gain.setValueAtTime(v,ac.currentTime);e.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);b.connect(f);f.connect(e);e.connect(mg);b.start();b.stop(ac.currentTime+d)}catch(x){}}
function thump(){nz(.07,160+T.thr*140,.12+T.thr*.1)}
function shot(){nz(.05,2400,.1);if(sok())note(150,.05,'square',mg,.07)}
function bang(){nz(.5,700,.5);if(sok())note(55,.4,'sine',mg,.6)}
function clang(){if(sok())note(180,.12,'square',mg,.18);nz(.08,3000,.15)}
const mf=m=>440*2**((m-69)/12),CH=[[52,59,64,67],[48,55,60,64],[45,52,57,60],[47,54,59,63]],ROOT=[40,36,33,35],LEAD=[[71,67],[72,67],[69,64],[71,68]];
function musicTick(){if(!ac||mute||state!=='play'||ac.state!=='running')return;const s=mStep%16,bar=(mStep>>4)%12,ci=bar%4;mStep++;if(Math.hypot(T.x-CON.x,T.y-CON.y)<700){concertTick(s,bar);return}
 if(bar<4){if(s%2===0){note(mf(CH[ci][[0,1,2,3,2,1,2,3][s>>1]]),.55,'triangle',mg,.5);if(s===0)note(mf(CH[ci][0]-12),1.3,'sine',mg,.5)}return}
 if([1,0,1,1][s%4]){const f=mf(ROOT[ci]),d=s%4===0?.18:.09;note(f,d,'sawtooth',dist,.9);note(f*2,d*.8,'sawtooth',dist,.4)}
 if(s===0||s===8)note(mf(LEAD[ci][s>>3]),.8,'sawtooth',dist,.3);
 if(s%4===0||s===10){const o=ac.createOscillator(),v=ac.createGain();o.frequency.setValueAtTime(140,ac.currentTime);o.frequency.exponentialRampToValueAtTime(40,ac.currentTime+.12);v.gain.setValueAtTime(.9,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.14);o.connect(v);v.connect(mg);o.start();o.stop(ac.currentTime+.15)}
 if(B.st===0&&Math.hypot(T.x-B.x,T.y-B.y)<900&&s%2===1)nz(.04,6000,.12);
 if(s===4||s===12){const b=ac.createBufferSource(),v=ac.createGain();b.buffer=noiseBuf;v.gain.setValueAtTime(.4,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.12);b.connect(v);v.connect(mg);b.start()}}

/* concert metal: fast palm-muted gallop, double kick, snare, screaming lead (plays near the stage) */
function kick(){const o=ac.createOscillator(),v=ac.createGain();o.frequency.setValueAtTime(140,ac.currentTime);o.frequency.exponentialRampToValueAtTime(40,ac.currentTime+.12);v.gain.setValueAtTime(.9,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.14);o.connect(v);v.connect(mg);o.start();o.stop(ac.currentTime+.15)}
const OFF=[0,0,0,1,0,0,3,0,0,0,0,1,0,0,6,5],TR=[0,0,3,1];
function concertTick(s,bar){const tr=TR[bar%4],m=40+tr+OFF[s],d=s%4===0?.13:.07;
 note(mf(m),d,'sawtooth',dist,.9);note(mf(m+7),d*.8,'sawtooth',dist,.35);note(mf(m-12),d,'square',mg,.2);
 if(s%8===0)note(mf(52+tr),1,'sawtooth',dist,.25);
 if(s===0||s===6||s===10||s===14)note(mf(76+tr+(s>8?-1:0)),.5,'sawtooth',dist,.22);
 if(s%2===0)kick();
 if(s===4||s===12){const b=ac.createBufferSource(),v=ac.createGain();b.buffer=noiseBuf;v.gain.setValueAtTime(.5,ac.currentTime);v.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.12);b.connect(v);v.connect(mg);b.start()}
 if(s%2===1)nz(.04,6000,.14);
 if(s===0&&bar%4===0)nz(.9,5000,.25)}

/* ===== player.js + weapons.js: Tim-berhawk ===== */
const T={x:BASE.x,y:BASE.y+120,a:-Math.PI/2,vx:0,vy:0,va:0,rot:0,thr:0,gun:0};
let bullets=[],fx=[],rings=[];
function horn(){gobble();rings.push({x:T.x,y:T.y,r:20});shake=9;say('GOBBLE! Johnny’s Horn')}
function update(){
 const L=keys.KeyA||keys.ArrowLeft?1:0,Rt=keys.KeyD||keys.ArrowRight?1:0,up=keys.KeyW||keys.ArrowUp,dn=keys.KeyS||keys.ArrowDown;
 T.va+=(Rt-L)*.0042;T.va*=.9;T.a+=T.va;T.thr+=((up&&F.fuel>0?1:0)-T.thr)*.12;
 T.vx+=Math.cos(T.a)*T.thr*.085;T.vy+=Math.sin(T.a)*T.thr*.085;
 const dr=dn?.94:(F.fuel>0?.985:.97);T.vx*=dr;T.vy*=dr;
 const fx_=Math.cos(T.a),fy=Math.sin(T.a),fv=T.vx*fx_+T.vy*fy;T.vx-=(T.vx-fv*fx_)*.035;T.vy-=(T.vy-fv*fy)*.035;
 T.x+=T.vx;T.y+=T.vy;
 if(T.x<40){T.x=40;T.vx=Math.abs(T.vx)*.4}if(T.x>MAP-40){T.x=MAP-40;T.vx=-Math.abs(T.vx)*.4}
 if(T.y<40){T.y=40;T.vy=Math.abs(T.vy)*.4}if(T.y>MAP-40){T.y=MAP-40;T.vy=-Math.abs(T.vy)*.4}
 T.rot+=.6+T.thr*.3;T.gun--;if(frame%9===0)thump();
 if(F.armor<40&&frame%4===0)fx.push({x:T.x-Math.cos(T.a)*10,y:T.y-Math.sin(T.a)*10,vx:(Math.random()-.5)*.8,vy:-.6-Math.random()*.6,l:22,c:F.armor<20?'rgba(255,120,40,':'rgba(70,70,70,'});
 if(keys.Space&&T.gun<=0){T.gun=5;shot();const c=Math.cos(T.a),s=Math.sin(T.a);for(const k of[-1,1]){const ox=T.x+c*30-s*20*k,oy=T.y+s*30+c*20*k;bullets.push({x:ox,y:oy,vx:c*13+T.vx,vy:s*13+T.vy,l:55})}}
 if(T.thr>.5&&frame%3===0)fx.push({x:T.x-Math.cos(T.a)*26,y:T.y-Math.sin(T.a)*26,vx:-T.vx*.3+(Math.random()-.5),vy:-T.vy*.3+(Math.random()-.5),l:22,c:'rgba(255,170,60,'});
 for(const b of bullets){b.x+=b.vx;b.y+=b.vy;b.l--}for(const p of fx){p.x+=p.vx;p.y+=p.vy;p.l--}for(const r of rings)r.r+=9;
 bullets=bullets.filter(b=>b.l>0);fx=fx.filter(p=>p.l>0);rings=rings.filter(r=>r.r<420);
 msgT--;nbub--;if(frame%420===0&&Math.hypot(T.x-BASE.x,T.y-BASE.y)<600)nbub=110;
 missionUpdate();p3Update();p6Update();bossUpdate();camUpdate()}

/* ===== missions.js: Mission 1, Droogs rescue ===== */
const CAP=3,FANPOS=[[-170,100],[150,120],[-60,205],[190,-10],[0,45]],PAD={x:BASE.x,y:BASE.y+120},CON=POI[1];
const M={fans:[],aboard:0,rescued:0,score:0,prog:0,doneAt:0};
function resetMission(mv){M.fans=FANPOS.map(([dx,dy])=>({x:CON.x+dx,y:CON.y+dy,s:0}));M.aboard=0;M.rescued=0;M.score=0;M.prog=0;M.doneAt=0;
 if(mv){resetP3();resetBoss();Object.assign(T,{x:PAD.x,y:PAD.y,a:-Math.PI/2,vx:0,vy:0,va:0});cam.x=Math.max(0,Math.min(MAP-vw,T.x-vw/2));cam.y=Math.max(0,Math.min(MAP-vh,T.y-vh/2))}}
function blip(a){if(!ac||!mg)return;try{a.forEach((f,i)=>setTimeout(()=>note(f,.2,'square',mg,.25),i*100))}catch(e){}}
function objTarget(){const w=M.fans.filter(f=>f.s===0);if(M.aboard>=CAP||(M.aboard>0&&!w.length))return{x:PAD.x,y:PAD.y,base:1};let b=null,d=1e9;for(const f of w){const k=Math.hypot(f.x-T.x,f.y-T.y);if(k<d){d=k;b=f}}return b||{x:PAD.x,y:PAD.y,base:1}}
function missionUpdate(){if(M.doneAt)return;
 const slow=Math.hypot(T.vx,T.vy)<1.3;let tgt=null;
 if(slow&&M.aboard<CAP)for(const f of M.fans)if(f.s===0&&Math.hypot(T.x-f.x,T.y-f.y)<70){tgt=f;break}
 const atBase=M.aboard>0&&slow&&Math.hypot(T.x-PAD.x,T.y-PAD.y)<80;
 if(tgt||atBase)M.prog++;else M.prog=Math.max(0,M.prog-2);
 if(M.prog<50)return;M.prog=0;
 if(tgt){tgt.s=1;M.aboard++;blip([660,880]);shake=4;say(M.aboard>=CAP?'Full load! Head for base camp.':'Fan aboard! '+(5-M.rescued-M.aboard)+' to go')}
 else{const n=M.aboard;M.fans.forEach(f=>{if(f.s===1)f.s=2});M.rescued+=n;M.score+=n*500;M.aboard=0;blip([523,659]);
  if(M.rescued>=5){M.score+=1000;M.doneAt=frame||1;state='done';blip([523,659,784,1047])}else say('Dropped '+n+'! '+(5-M.rescued)+' fans left. Go back for them.')}}
function drawFans(){for(const f of M.fans)if(f.s===0){const w=Math.sin(frame*.2+f.x)*5;g.strokeStyle='rgba(255,211,107,'+(.5+.3*Math.sin(frame*.1))+')';g.lineWidth=3;g.beginPath();g.arc(f.x,f.y,42+Math.sin(frame*.1)*4,0,7);g.stroke();
 g.fillStyle='#e8c24a';g.fillRect(f.x-5,f.y-2,10,14);g.fillStyle='#d8a074';g.beginPath();g.arc(f.x,f.y-8,6,0,7);g.fill();g.strokeStyle='#d8a074';g.lineWidth=3;g.beginPath();g.moveTo(f.x-5,f.y);g.lineTo(f.x-12,f.y-14+w);g.moveTo(f.x+5,f.y);g.lineTo(f.x+12,f.y-14-w);g.stroke();tx('HELP!',f.x,f.y-28,14,'#fff')}
 if(M.aboard>0){g.strokeStyle='rgba(95,209,106,'+(.4+.3*Math.sin(frame*.15))+')';g.lineWidth=4;g.beginPath();g.arc(PAD.x,PAD.y,72,0,7);g.stroke()}}
function drawGuide(){if(M.prog>0){g.strokeStyle='#5fd16a';g.lineWidth=6;g.beginPath();g.arc(T.x,T.y,70,-Math.PI/2,-Math.PI/2+M.prog/50*6.283);g.stroke()}
 const t=objTarget();if(Math.hypot(t.x-T.x,t.y-T.y)>140){const a=Math.atan2(t.y-T.y,t.x-T.x);g.save();g.translate(T.x+Math.cos(a)*110,T.y+Math.sin(a)*110);g.rotate(a);g.fillStyle=t.base?'#5fd16a':'#ffd36b';g.beginPath();g.moveTo(16,0);g.lineTo(-8,-11);g.lineTo(-8,11);g.fill();g.restore()}}
function drawHUD(){const w=Math.min(290,vw-150),x=10,y=82,t=objTarget(),d=Math.round(Math.hypot(t.x-T.x,t.y-T.y)/10);
 g.fillStyle='rgba(0,0,0,.55)';g.fillRect(x,y,w,88);g.strokeStyle='#c8201e';g.lineWidth=2;g.strokeRect(x,y,w,88);
 tx('MISSION 1: DROOGS RESCUE',x+8,y+20,16,'#e04fd0','left');tx('Rescued '+M.rescued+'/5   Aboard '+M.aboard+'/'+CAP,x+8,y+42,15,'#efe6d2','left');tx('Score '+M.score,x+8,y+62,15,'#e8c24a','left');
 tx((t.base?'Land on the H at base':'Hover low, land by a fan')+'  '+d+'m',x+8,y+80,13,t.base?'#5fd16a':'#ffd36b','left')}
resetMission(0);

/* ===== fuel.js + enemies.js: Priority 3, fuel and enemy bases ===== */
const F={fuel:100,armor:100,empty:0,refuel:0,low:0,deadAt:0,why:''},DEPOT=POI.find(p=>p.k==='depot'),EBASES=[{x:500,y:700,n:'Prims',done:0},{x:3500,y:2100,n:'Enemy outpost',done:0}];
let TUR=[],ebul=[];const BB={t:0,cd:0};const U={lv:0,n:0,cd:0},MIS=[],BN={t:0},CHT={t:0,cd:0};let ZN=0;
function resetP3(){U.lv=0;U.n=0;MIS.length=0;BN.t=0;F.fuel=100;F.armor=100;F.empty=0;F.low=0;ebul=[];TUR=[];EBASES.forEach((b,i)=>{b.done=0;for(const[dx,dy]of[[-158,-158],[158,-158],[-158,158],[158,158]])TUR.push({x:b.x+dx,y:b.y+dy,hp:20,b:i,cd:40+(Math.random()*60|0),a:0})})}
resetP3();
function boom(x,y){bang();for(let i=0;i<8;i++){const a=Math.random()*6.283,s=2+Math.random()*4;fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:26,c:'rgba(255,230,120,'})}for(let i=0;i<16;i++){const a=Math.random()*6.283,s=1+Math.random()*3;fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:22,c:i%3?'rgba(255,150,40,':'rgba(90,90,90,'})}}
function crash(why){if(state!=='play')return;state='dead';F.why=why;F.deadAt=frame;boom(T.x,T.y);shake=18;blip([200,150,100])}
function hurt(n){clang();F.armor-=n;shake=8;fx.push({x:T.x,y:T.y,vx:0,vy:0,l:12,c:'rgba(255,90,60,'});if(F.armor<=0){F.armor=0;crash('Shot down')}}
function respawn(){const lost=M.aboard;F.fuel=100;F.armor=100;F.empty=0;ebul=[];for(const f of M.fans)if(f.s===1)f.s=0;M.aboard=0;M.prog=0;Object.assign(T,{x:PAD.x,y:PAD.y,a:-Math.PI/2,vx:0,vy:0,va:0,thr:0});cam.x=Math.max(0,Math.min(MAP-vw,T.x-vw/2));cam.y=Math.max(0,Math.min(MAP-vh,T.y-vh/2));say(lost?'New chopper. The fans you carried are waiting again.':'New chopper. Back to it, Tim!')}
function p3Update(){
 F.fuel=Math.max(0,F.fuel-.01-T.thr*.02);
